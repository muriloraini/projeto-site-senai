<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho</title>
</head>
<body>

<style>
    header {
        background-color: #940000d3;
        color: #fff;
        padding: 10px;
        text-align: center;
    }
    table, th, td {
        border: 2px solid rgb(138, 137, 137);
        border-collapse: collapse;
    }
    body { background-color: #fffef4; }
    th { background-color: #5a5a5a2c; }
    footer { background-color: #940000d3; border: 1px solid #000; margin-top: 50px; }
    
    .botao-acao {
        background-color: #bbbbbb;
        color: rgb(0, 0, 0);
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
    }
</style>

    <header style="display: flex; align-items: center; gap: 15px;">
        <h1 style="margin: 0; padding: 10px;">Carrinho de Compras</h1>
    </header>
    <hr>

    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 50vh; padding: 20px; box-sizing: border-box;">
        
        <!-- Tabela Simples do Carrinho -->
        <table border="1" style="border-collapse: collapse; margin-bottom: 20px; width: 80%; max-width: 600px;">
            <thead>
                <tr>
                    <th>PRODUTO</th>
                    <th>QUANTIDADE</th>
                    <th>PREÇO TOTAL</th>
                </tr>
            </thead>
            <tbody id="lista-produtos-carrinho">
                <!-- O JavaScript vai colocar os itens aqui dentro -->
            </tbody>
        </table>

        <div style="display: flex; gap: 15px; margin-top: 20px;" id="acoes-carrinho">
            <a href="/" class="botao-acao">Continuar Comprando</a>
            <button onclick="finalizarCompra()" class="botao-acao" style="background-color: #4caf50; color: white;">Finalizar Compra</button>
            <button onclick="limparCarrinho()" class="botao-acao" style="background-color: #ff9999;">Limpar Carrinho</button>
        </div>

    </div>

    <script>
        function atualizarCarrinho() {
            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
            let tabela = document.getElementById('lista-produtos-carrinho');
            let acoes = document.getElementById('acoes-carrinho');

            if (carrinho.length === 0) {
                tabela.innerHTML = "<tr><td colspan='3' style='text-align: center; padding: 15px;'>Seu carrinho está vazio!</td></tr>";
                if (acoes) acoes.style.display = 'none';
                return;
            }

            if (acoes) acoes.style.display = 'flex';
            tabela.innerHTML = "";

            carrinho.forEach(item => {
                let totalItem = item.qtd * item.valor;
                let linha = `<tr>
                    <td style="padding: 10px;">${item.nome}</td>
                    <td style="padding: 10px; text-align: center;">${item.qtd}</td>
                    <td style="padding: 10px; text-align: center;">R$ ${totalItem.toFixed(2)}</td>
                </tr>`;
                tabela.innerHTML += linha;
            });
        }

        window.onload = function() {
            atualizarCarrinho();
        }

        function limparCarrinho() {
            const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
            const estoque = JSON.parse(localStorage.getItem('estoqueMercado')) || {};

            carrinho.forEach(item => {
                if (estoque[item.nome] !== undefined) {
                    estoque[item.nome] += item.qtd;
                }
            });

            localStorage.setItem('estoqueMercado', JSON.stringify(estoque));
            localStorage.removeItem('carrinho');
            atualizarCarrinho();
            window.location.href = '/';
        }

        function finalizarCompra() {
            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

            if (carrinho.length === 0) {
                alert('Seu carrinho está vazio!');
                return;
            }

            const mapaNomes = {
                'duzia de ovos': 'Ovo',
                'duzia de ovo': 'Ovo',
                'ovo': 'Ovo',
                'leite': 'Leite',
                'queijo': 'Queijo'
            };

            const historico = JSON.parse(localStorage.getItem('vendasMercado')) || [];
            const vendasHoje = carrinho.map(item => {
                const nomeOriginal = String(item.nome || '').trim();
                const nomeNormalizado = mapaNomes[nomeOriginal.toLowerCase()] || nomeOriginal;

                return {
                    nome: nomeNormalizado,
                    qtd: item.qtd,
                    valor: item.valor,
                    data: new Date().toISOString()
                };
            });

            historico.push(...vendasHoje);
            localStorage.setItem('vendasMercado', JSON.stringify(historico));
            localStorage.setItem('vendasMercado_sync', String(Date.now()));
            window.dispatchEvent(new Event('vendas-atualizadas'));

            if ('BroadcastChannel' in window) {
                const canalVendas = new BroadcastChannel('mercado_vendas');
                canalVendas.postMessage({ tipo: 'vendas-atualizadas' });
            }

            const valorTotal = carrinho.reduce((total, item) => total + (item.qtd * item.valor), 0);
            localStorage.removeItem('carrinho');
            atualizarCarrinho();
            alert(`Compra finalizada com sucesso! Valor total: R$ ${valorTotal.toFixed(2)}`);
        }
    </script>

</body>
<footer>
    <h4 style="color: white; padding: 5px;"> --> E-mail:</h4><a href="mailto:MercadoBoam@example.com" style="color: white; padding: 5px;">mailto:Mercado@example.com</a>
</footer>
</html>
